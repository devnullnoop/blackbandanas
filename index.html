<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Bandanas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0807;
    --paper: #d4c5a9;
    --paper-dim: #8a7963;
    --gold: #b8935a;
    --gold-bright: #e0b870;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background-color: #241a11;
    background-image:
      repeating-linear-gradient(0deg,
        rgba(0,0,0,0.9) 0 1px,
        rgba(255,255,255,0.04) 1px 2px,
        transparent 2px 132px),
      repeating-linear-gradient(0deg,
        rgba(0,0,0,0.05) 0 1px,
        transparent 1px 3px,
        rgba(0,0,0,0.03) 4px 5px,
        transparent 5px 12px),
      radial-gradient(ellipse 52px 26px at 22% 18%, rgba(0,0,0,0.42), transparent 70%),
      radial-gradient(ellipse 38px 18px at 78% 62%, rgba(0,0,0,0.35), transparent 70%),
      radial-gradient(ellipse 58px 28px at 14% 82%, rgba(0,0,0,0.32), transparent 70%),
      radial-gradient(ellipse 32px 16px at 88% 28%, rgba(0,0,0,0.28), transparent 70%),
      repeating-linear-gradient(0deg,
        #2a1e13 0 132px,
        #2f2217 132px 264px,
        #281c12 264px 396px,
        #332518 396px 528px);
    background-attachment: fixed;
    color: var(--paper);
    font-family: 'IM Fell English', serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1000;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.025) 1px, transparent 0);
    background-size: 3px 3px;
    mix-blend-mode: overlay;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 100%);
  }

  .atmosphere {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 48%, rgba(210, 180, 140, 0.22), transparent 75%),
      radial-gradient(ellipse 50% 40% at 50% 52%, rgba(184, 147, 90, 0.15), transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  .border-strip {
    position: fixed;
    left: 0;
    right: 0;
    padding: 10px 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, rgba(10,8,7,0.98), rgba(10,8,7,0.5));
    border-bottom: 1px solid rgba(184, 147, 90, 0.2);
  }
  .border-strip.bottom {
    bottom: 0;
    top: auto;
    background: linear-gradient(0deg, rgba(10,8,7,0.98), rgba(10,8,7,0.5));
    border-bottom: none;
    border-top: 1px solid rgba(184, 147, 90, 0.2);
  }
  .border-strip.top { top: 0; }

  .border-strip .ornament {
    font-family: 'Rye', serif;
    color: var(--gold);
    letter-spacing: 0.4em;
    font-size: 0.68rem;
    opacity: 0.7;
    text-transform: uppercase;
  }

  main {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 70px 24px 90px;
  }

  .logo-composition {
    position: relative;
    width: min(540px, 82vw);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: fadeIn 1.6s ease-out 0.6s forwards;
  }

  .circular-text-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .circular-text-svg text {
    font-family: 'Rye', serif;
    fill: var(--gold-bright);
    font-size: 62px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .circular-text-svg .ornament-star {
    font-size: 44px;
    fill: var(--gold);
  }
  .circular-text-svg .cluster-dot {
    fill: var(--gold);
    opacity: 0.55;
  }
  .circular-text-svg .cluster-line {
    stroke: var(--gold);
    stroke-width: 0.9;
    opacity: 0.3;
    fill: none;
  }

  .bandanas-container {
    width: 76%;
    position: relative;
    z-index: 3;
    filter: drop-shadow(0 25px 50px rgba(0,0,0,0.9)) drop-shadow(0 0 40px rgba(184,147,90,0.12));
  }

  .bandanas-container svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .glow-ring {
    position: absolute;
    inset: 25%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184,147,90,0.1) 0%, transparent 65%);
    z-index: 1;
    animation: pulseGlow 5s ease-in-out infinite;
  }

  .subtitle-section {
    margin-top: 24px;
    text-align: center;
    opacity: 0;
    animation: fadeUp 1s ease-out 1.6s forwards;
  }

  .tagline {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--paper);
    letter-spacing: 0.03em;
    margin-bottom: 12px;
  }

  .tagline-sub {
    font-family: 'Rye', serif;
    font-size: 0.65rem;
    letter-spacing: 0.5em;
    color: var(--gold);
    text-transform: uppercase;
    opacity: 0.8;
  }

  .ornament-line {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 18px auto;
    width: 280px;
    max-width: 80%;
  }
  .ornament-line::before,
  .ornament-line::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.6;
  }
  .ornament-line span {
    padding: 0 14px;
    color: var(--gold);
    font-size: 0.55rem;
    letter-spacing: 0.3em;
    font-family: 'Rye', serif;
  }

  .contact-email {
    display: inline-block;
    margin-top: 14px;
    font-family: 'IM Fell English', serif;
    font-size: 0.95rem;
    color: var(--paper);
    letter-spacing: 0.08em;
    text-decoration: none;
    border-bottom: 1px solid rgba(184, 147, 90, 0.35);
    padding-bottom: 2px;
    transition: color 0.3s ease, border-color 0.3s ease;
  }

  .contact-email:hover {
    color: var(--gold-bright);
    border-bottom-color: var(--gold-bright);
  }

  .side-mark {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Rye', serif;
    font-size: 0.58rem;
    letter-spacing: 0.4em;
    color: var(--paper-dim);
    opacity: 0.4;
    writing-mode: vertical-rl;
    z-index: 11;
    text-transform: uppercase;
  }
  .side-mark.left { left: 20px; }
  .side-mark.right { right: 20px; transform: translateY(-50%) rotate(180deg); }

  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* Wanted poster — parchment pinned on the wall */
  .wanted-poster {
    position: relative;
    width: min(620px, 92vw);
    padding: 34px 34px 28px;
    background:
      radial-gradient(circle at 15% 22%, rgba(60, 40, 20, 0.14), transparent 12%),
      radial-gradient(circle at 88% 12%, rgba(40, 20, 10, 0.12), transparent 10%),
      radial-gradient(circle at 92% 82%, rgba(60, 40, 20, 0.15), transparent 14%),
      radial-gradient(circle at 8% 76%, rgba(40, 20, 10, 0.10), transparent 12%),
      radial-gradient(ellipse at center, transparent 55%, rgba(40, 20, 10, 0.22) 100%),
      linear-gradient(145deg, #d4c5a9 0%, #c9b796 50%, #b8a079 100%);
    border: 3px solid #1a0d06;
    box-shadow:
      inset 0 0 0 7px #c9b796,
      inset 0 0 0 8px #1a0d06,
      0 30px 60px rgba(0, 0, 0, 0.85),
      0 10px 20px rgba(0, 0, 0, 0.55);
    transform: rotate(-0.45deg);
    opacity: 0;
    animation: fadeIn 1s ease-out 0.2s forwards;
  }

  .masthead {
    font-family: 'Rye', serif;
    font-size: clamp(3rem, 11vw, 5.6rem);
    color: #1a0d06;
    line-height: 0.9;
    display: flex;
    justify-content: center;
    text-shadow: 0 1px 0 rgba(255,255,255,0.1), 0 -1px 0 rgba(0,0,0,0.22);
  }
  .masthead.top { margin: 2px 0 2px; }
  .masthead.top span { letter-spacing: 0.32em; margin-right: -0.32em; }
  .masthead.bottom { margin: 2px 0 6px; }
  .masthead.bottom span { letter-spacing: 0.08em; margin-right: -0.08em; }

  .wanted-poster .masthead-rule {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 4px auto;
    width: 90%;
    max-width: 560px;
  }
  .wanted-poster .masthead-rule::before,
  .wanted-poster .masthead-rule::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #1a0d06 25%, #1a0d06 75%, transparent);
    opacity: 0.55;
  }
  .wanted-poster .masthead-rule span {
    padding: 0 14px;
    color: #1a0d06;
    font-size: 0.95rem;
    font-family: 'Rye', serif;
    opacity: 0.75;
  }

  .wanted-poster .corner {
    position: absolute;
    width: 22px;
    height: 22px;
    pointer-events: none;
    opacity: 0.85;
  }
  .wanted-poster .corner::before,
  .wanted-poster .corner::after {
    content: '';
    position: absolute;
    background: #1a0d06;
  }
  .wanted-poster .corner::before { inset: 0 0 auto 0; height: 2px; }
  .wanted-poster .corner::after  { inset: 0 auto 0 0; width: 2px; }
  .wanted-poster .corner.tr { top: 10px; right: 10px; transform: scaleX(-1); }
  .wanted-poster .corner.tl { top: 10px; left: 10px; }
  .wanted-poster .corner.br { bottom: 10px; right: 10px; transform: scale(-1, -1); }
  .wanted-poster .corner.bl { bottom: 10px; left: 10px; transform: scaleY(-1); }

  .wanted-poster .circular-text-svg text { fill: #1a0d06; }
  .wanted-poster .circular-text-svg .ornament-star { fill: #3a2412; opacity: 0.85; }
  .wanted-poster .circular-text-svg .cluster-dot { fill: #3a2412; opacity: 0.75; }
  .wanted-poster .circular-text-svg .cluster-line { stroke: #3a2412; opacity: 0.5; }

  .wanted-poster .glow-ring {
    background: radial-gradient(circle, rgba(60, 40, 20, 0.18) 0%, transparent 60%);
    animation: none;
    opacity: 0.6;
  }
  .wanted-poster .bandanas-container {
    filter: drop-shadow(0 10px 16px rgba(0,0,0,0.38));
  }

  .wanted-poster .contact-email {
    color: #2a1a0d;
    border-bottom-color: rgba(26, 13, 6, 0.4);
    margin-top: 18px;
  }
  .wanted-poster .contact-email:hover {
    color: #1a0d06;
    border-bottom-color: #1a0d06;
  }
  .wanted-poster .tagline { color: #2a1a0d; }
  .wanted-poster .tagline-sub { color: #5a3a1e; opacity: 1; }
  .wanted-poster .ornament-line span { color: #5a3a1e; }
  .wanted-poster .ornament-line::before,
  .wanted-poster .ornament-line::after {
    background: linear-gradient(90deg, transparent, #5a3a1e, transparent);
    opacity: 0.7;
  }

  @media (max-width: 640px) {
    .circular-text-svg text { font-size: 56px; letter-spacing: 0.15em; }
    .side-mark { display: none; }
    main { padding: 50px 16px 70px; }
    .wanted-poster { padding: 24px 18px 20px; transform: none; }
    .masthead { font-size: clamp(2.6rem, 14vw, 4.4rem); }
  }
</style>
</head>
